[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensrbio-openmhealth"
version = "0.1.0"
description = "Export Sensr Bio API data into Open mHealth (OMH) compliant JSON. Sensr → OMH."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sensr Bio" }]
keywords = ["openmhealth", "omh", "sensr", "wearables", "health"]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "click>=8.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.3",
]

[project.scripts]
sensr-to-omh = "sensrbio_omh.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["sensrbio_omh*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
